<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>Your sign-in OTP</title>
    <style>
      @media (prefers-color-scheme: dark) {
        .page { background-color: #09090b !important; }
        .card { background-color: #18181b !important; border-color: #27272a !important; }
        .otp { background-color: #27272a !important; border-color: #3f3f46 !important; }
        .text { color: #fafafa !important; }
        .muted { color: #a1a1aa !important; }
      }
    </style>
  </head>
  <body class="page" style="margin: 0; padding: 0; background-color: #f4f4f5">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      class="page"
      style="background-color: #f4f4f5"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            class="card"
            style="
              max-width: 440px;
              background-color: #ffffff;
              border: 1px solid #e4e4e7;
              border-radius: 12px;
            "
          >
            <tr>
              <td
                class="muted"
                style="
                  padding: 28px 28px 0;
                  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                    Roboto, Helvetica, Arial, sans-serif;
                  font-size: 14px;
                  font-weight: 600;
                  letter-spacing: 0.04em;
                  text-transform: uppercase;
                  color: #52525b;
                "
              >
                Crossland Biathlon
              </td>
            </tr>
            <tr>
              <td
                class="text"
                style="
                  padding: 12px 28px 0;
                  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                    Roboto, Helvetica, Arial, sans-serif;
                  font-size: 16px;
                  line-height: 24px;
                  color: #18181b;
                "
              >
                Someone asked to sign in to Crossland Biathlon with this email address. Enter this sign-in OTP to continue:
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 20px 28px">
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  class="otp"
                  style="
                    background-color: #f4f4f5;
                    border: 1px solid #d4d4d8;
                    border-radius: 8px;
                  "
                >
                  <tr>
                    <td
                      class="text"
                      style="
                        padding: 14px 24px;
                        font-family: 'SFMono-Regular', Menlo, Consolas,
                          'Liberation Mono', monospace;
                        font-size: 34px;
                        font-weight: 700;
                        letter-spacing: 0.15em;
                        color: #18181b;
                      "
                    >{{ .Token }}</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td
                class="muted"
                style="
                  padding: 0 28px 28px;
                  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                    Roboto, Helvetica, Arial, sans-serif;
                  font-size: 14px;
                  line-height: 22px;
                  color: #52525b;
                "
              >
                Expires in 1 hour.<br />
                Didn't ask for this? You can ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
